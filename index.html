<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="description" content="Dagleg innskráning í þrjár vikur: rækt, kreatín og bæn, dag fyrir dag.">
<meta name="theme-color" content="#EAEDEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Þrjár vikur">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23161B18%22/%3E%3Crect x=%2212%22 y=%2214%22 width=%2240%22 height=%2210%22 rx=%223%22 fill=%22%23E4694B%22/%3E%3Crect x=%2212%22 y=%2227%22 width=%2240%22 height=%2210%22 rx=%223%22 fill=%22%233EB3C2%22/%3E%3Crect x=%2212%22 y=%2240%22 width=%2240%22 height=%2210%22 rx=%223%22 fill=%22%239689DE%22/%3E%3C/svg%3E">
<title>Þrjár vikur</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EAEDEB;
  --surface:#F6F8F6;
  --raised:#FFFFFF;
  --ink:#161B18;
  --ink-2:#3B4542;
  --muted:#6D7873;
  --line:#D0D7D2;
  --line-soft:#DFE4E0;
  --on-accent:#F7F9F7;

  --h1:#A63A24;  --h1-tint:rgba(166,58,36,.10);  --h1-edge:rgba(166,58,36,.34);
  --h2:#0F6E7C;  --h2-tint:rgba(15,110,124,.10); --h2-edge:rgba(15,110,124,.34);
  --h3:#544A97;  --h3-tint:rgba(84,74,151,.10);  --h3-edge:rgba(84,74,151,.34);

  --score:#46586A; --score-tint:rgba(70,88,106,.12); --score-edge:rgba(70,88,106,.26);

  --radius:14px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101311;
    --surface:#171B19;
    --raised:#1E2321;
    --ink:#E7EBE8;
    --ink-2:#B6BEBA;
    --muted:#848E89;
    --line:#2B322E;
    --line-soft:#242A27;
    --on-accent:#12150F;

    --h1:#E4694B;  --h1-tint:rgba(228,105,75,.14);  --h1-edge:rgba(228,105,75,.40);
    --h2:#3EB3C2;  --h2-tint:rgba(62,179,194,.14);  --h2-edge:rgba(62,179,194,.40);
    --h3:#9689DE;  --h3-tint:rgba(150,137,222,.14); --h3-edge:rgba(150,137,222,.40);

    --score:#90A6B8; --score-tint:rgba(144,166,184,.15); --score-edge:rgba(144,166,184,.32);
  }
}

:root[data-theme="dark"]{
  --paper:#101311;
  --surface:#171B19;
  --raised:#1E2321;
  --ink:#E7EBE8;
  --ink-2:#B6BEBA;
  --muted:#848E89;
  --line:#2B322E;
  --line-soft:#242A27;
  --on-accent:#12150F;

  --h1:#E4694B;  --h1-tint:rgba(228,105,75,.14);  --h1-edge:rgba(228,105,75,.40);
  --h2:#3EB3C2;  --h2-tint:rgba(62,179,194,.14);  --h2-edge:rgba(62,179,194,.40);
  --h3:#9689DE;  --h3-tint:rgba(150,137,222,.14); --h3-edge:rgba(150,137,222,.40);

  --score:#90A6B8; --score-tint:rgba(144,166,184,.15); --score-edge:rgba(144,166,184,.32);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}

.wrap{
  max-width:560px;
  margin:0 auto;
  padding:28px 16px calc(40px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* ---------- header ---------- */

.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  font-weight:500;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 6px;
}

h1{
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-weight:800;
  font-size:clamp(34px,11vw,46px);
  line-height:.95;
  letter-spacing:-.025em;
  text-wrap:balance;
  margin:0;
}

.tagline{
  margin:10px 0 0;
  color:var(--muted);
  font-size:14px;
  max-width:34ch;
}

/* ---------- summary ---------- */

.summary{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 16px 14px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.totals{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  align-items:start;
  gap:10px;
  padding-bottom:15px;
  border-bottom:1px solid var(--line-soft);
}

.stat-num{
  font-family:Archivo,sans-serif;
  font-weight:800;
  font-size:29px;
  line-height:1;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.stat-num span{color:var(--muted);font-size:16px;font-weight:600;letter-spacing:0}

.total-label{
  font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;
  line-height:1.35;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:6px;
}

/* ---------- daily score sparkline ---------- */

.score-block{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-top:15px;
  border-top:1px solid var(--line-soft);
}

.score-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
}
.score-title{
  font-size:12.5px;
  font-weight:600;
  color:var(--ink-2);
}
.score-title::before{
  content:"";
  display:inline-block;
  width:7px;height:7px;
  border-radius:50%;
  background:var(--score);
  margin-right:7px;
  vertical-align:middle;
}
.score-note{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}

.spark{
  display:flex;
  align-items:flex-end;
  gap:2px;
  height:32px;
}
.spark-bar{
  flex:1;
  min-height:2px;
  background:var(--line-soft);
  border-radius:1.5px;
  transition:height .18s ease,background .18s ease;
}
.spark-bar.on{background:var(--score)}

.meters{display:flex;flex-direction:column;gap:11px}

.meter{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}

.meter-name{
  font-size:12.5px;
  font-weight:600;
  width:66px;
  color:var(--ink-2);
}
.meter-name::before{
  content:"";
  display:inline-block;
  width:7px;height:7px;
  border-radius:50%;
  background:var(--c);
  margin-right:7px;
  vertical-align:middle;
}

.bar{display:flex;gap:2px;height:11px}
.seg{flex:1;background:var(--line-soft);border-radius:1.5px;transition:background .18s ease}
.seg.on{background:var(--c)}

.meter-count{
  font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;
  font-weight:500;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  min-width:42px;
  text-align:right;
}

/* ---------- weeks ---------- */

.weeks{display:flex;flex-direction:column;gap:18px}

.week{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}

.week-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px 9px;
}

.week-label{
  font-family:Archivo,sans-serif;
  font-weight:700;
  font-size:13px;
}
.week-range{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  letter-spacing:.06em;
  color:var(--muted);
}

.head{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  padding:0 14px 8px;
}
.head-cells{display:flex;gap:8px}
.head-cell{
  width:46px;
  text-align:center;
  font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;
  font-weight:600;
  letter-spacing:.11em;
  color:var(--c);
}

.days{display:flex;flex-direction:column}

.day{
  position:relative;
  display:grid;
  grid-template-columns:1fr auto;
  grid-template-areas:"id cells" "scale scale";
  align-items:center;
  column-gap:12px;
  row-gap:9px;
  padding:9px 14px 12px;
  border-top:1px solid var(--line-soft);
}
.day-id{grid-area:id}
.cells{grid-area:cells}
.scale{grid-area:scale}

.day.today{background:var(--raised)}
.day.today::before{
  content:"";
  position:absolute;
  left:0;top:-1px;bottom:0;
  width:3px;
  background:var(--ink);
}
.day.future .day-num,.day.future .day-meta{opacity:.5}

.day-id{display:flex;align-items:baseline;gap:9px;min-width:0}

.scale{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:3px;
}
.sc{
  height:31px;
  border-radius:7px;
  border:1px solid var(--score-edge);
  background:transparent;
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  font-weight:500;
  font-variant-numeric:tabular-nums;
  padding:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .14s ease,color .14s ease,border-color .14s ease,transform .12s ease;
}
.sc.filled{background:var(--score-tint);border-color:transparent;color:var(--score)}
.sc.peak{background:var(--score);border-color:var(--score);color:var(--on-accent);font-weight:600}
.sc:active{transform:scale(.92)}
.sc:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (hover:hover){
  .sc:hover{border-color:var(--score)}
  .sc.peak:hover{border-color:var(--score)}
}

.day-num{
  font-family:"IBM Plex Mono",monospace;
  font-weight:600;
  font-size:14px;
  font-variant-numeric:tabular-nums;
  min-width:20px;
}

.day-meta{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:.05em;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.today-chip{
  font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;
  font-weight:600;
  letter-spacing:.13em;
  text-transform:uppercase;
  background:var(--ink);
  color:var(--paper);
  padding:2px 6px;
  border-radius:4px;
}

.cells{display:flex;gap:8px}

.cell{
  width:46px;height:46px;
  border-radius:11px;
  border:1.5px solid var(--e);
  background:var(--t);
  color:var(--c);
  display:grid;place-items:center;
  cursor:pointer;
  padding:0;
  -webkit-tap-highlight-color:transparent;
  transition:background .16s ease,border-color .16s ease,transform .12s ease;
}
.cell svg{width:22px;height:22px;opacity:0;transform:scale(.6);transition:opacity .16s ease,transform .2s cubic-bezier(.2,1.5,.4,1)}
.cell[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on-accent)}
.cell[aria-pressed="true"] svg{opacity:1;transform:scale(1)}
.cell:active{transform:scale(.93)}
.cell:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (hover:hover){
  .cell:hover{border-color:var(--c)}
}

/* ---------- footer ---------- */

.footer{
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:2px 2px 0;
}

.setting{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.setting label{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--muted);
}

input[type="date"]{
  font-family:"IBM Plex Mono",monospace;
  font-size:13px;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:9px;
  padding:7px 10px;
  min-height:38px;
}
input[type="date"]:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

.footer-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border-top:1px solid var(--line-soft);
  padding-top:12px;
}

.status{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  letter-spacing:.08em;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:7px;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--h2);flex:none}
.dot.pending{background:var(--h1)}
.dot.local{background:var(--muted)}

.reset{
  background:none;
  border:1px solid var(--line);
  border-radius:9px;
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  letter-spacing:.08em;
  padding:7px 11px;
  cursor:pointer;
  min-height:34px;
}
.reset:hover{color:var(--h1);border-color:var(--h1-edge)}
.reset:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

@media (min-width:900px){
  .wrap{max-width:1040px;padding-top:44px;gap:26px}
  .weeks{flex-direction:row;align-items:flex-start}
  .week{flex:1}
  h1{font-size:56px}
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">21 dagur · þrír hlutir</p>
    <h1>Þrjár vikur</h1>
    <p class="tagline">Merktu við á hverjum degi. Ekkert annað.</p>
  </header>

  <section class="summary">
    <div class="totals">
      <div>
        <div class="stat-num" id="total">0<span>/63</span></div>
        <div class="total-label">merkt við</div>
      </div>
      <div>
        <div class="stat-num" id="streak">0</div>
        <div class="total-label">fullir dagar í röð</div>
      </div>
      <div>
        <div class="stat-num" id="avg">—</div>
        <div class="total-label">meðaleinkunn</div>
      </div>
    </div>
    <div class="meters" id="meters"></div>
    <div class="score-block">
      <div class="score-head">
        <span class="score-title">Dagurinn 1–10</span>
        <span class="score-note" id="score-note">0 dagar skráðir</span>
      </div>
      <div class="spark" id="spark"></div>
    </div>
  </section>

  <main class="weeks" id="weeks"></main>

  <footer class="footer">
    <div class="setting">
      <label for="start">Byrjunardagur</label>
      <input type="date" id="start">
    </div>
    <div class="footer-row">
      <div class="status" id="status"><span class="dot local"></span><span id="status-text">Hleð…</span></div>
      <button class="reset" id="reset" type="button">Núllstilla</button>
    </div>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var HABITS = [
    { id:"raekt",   name:"Rækt",    tag:"RÆK", c:"var(--h1)", t:"var(--h1-tint)", e:"var(--h1-edge)" },
    { id:"kreatin", name:"Kreatín", tag:"KRE", c:"var(--h2)", t:"var(--h2-tint)", e:"var(--h2-edge)" },
    { id:"baen",    name:"Bæn",     tag:"BÆN", c:"var(--h3)", t:"var(--h3-tint)", e:"var(--h3-edge)" }
  ];
  var DAYS = 21;
  var WD = ["sun","mán","þri","mið","fim","fös","lau"];
  var LS_KEY = "thrjar-vikur-v1";
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>';

  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  var state = { start: todayISO(), done: {}, scores: {} };

  /* ---------- storage ---------- */

  var dbDoc = null;
  var writeTimer = null;
  var writing = false;

  function normalize(s){
    return {
      start: (s && typeof s.start === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s.start)) ? s.start : todayISO(),
      done: (s && s.done && typeof s.done === "object") ? s.done : {},
      scores: (s && s.scores && typeof s.scores === "object") ? s.scores : {}
    };
  }

  function loadLocal(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if(!raw) return;
      var parsed = JSON.parse(raw);
      if(parsed && typeof parsed === "object") state = normalize(parsed);
    }catch(e){/* start fresh */}
  }

  function saveLocal(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  }

  function setStatus(kind, text){
    var dot = document.querySelector("#status .dot");
    dot.className = "dot" + (kind ? " " + kind : "");
    document.getElementById("status-text").textContent = text;
  }

  function queueSave(){
    saveLocal();
    if(!dbDoc){ setStatus("local","Vistað í þessu tæki"); return; }
    setStatus("pending","Vistar…");
    clearTimeout(writeTimer);
    writeTimer = setTimeout(function(){
      writeTimer = null;
      writing = true;
      dbDoc.set({ start: state.start, done: state.done, scores: state.scores }).then(function(){
        writing = false;
        setStatus("", "Vistað");
      }).catch(function(){
        writing = false;
        setStatus("local","Vistað í þessu tæki");
      });
    }, 350);
  }

  function connect(){
    if(!window.claude || typeof window.claude.use !== "function"){
      setStatus("local","Vistað í þessu tæki");
      return;
    }
    window.claude.use("db").then(function(db){
      if(!db){ setStatus("local","Vistað í þessu tæki"); return; }
      dbDoc = db.doc("tracker/state");
      setStatus("", "Vistað");
      dbDoc.onSnapshot(function(snap){
        if(writing || writeTimer || snap.metadata.hasPendingWrites) return;
        if(!snap.exists){ queueSave(); return; }
        state = normalize(snap.data());
        saveLocal();
        render();
      }, function(){
        dbDoc = null;
        setStatus("local","Vistað í þessu tæki");
      });
    }).catch(function(){
      setStatus("local","Vistað í þessu tæki");
    });
  }

  /* ---------- dates ---------- */

  function dayDate(i){
    var p = state.start.split("-");
    return new Date(+p[0], +p[1]-1, +p[2] + i, 12, 0, 0);
  }

  function todayIndex(){
    var now = new Date();
    var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
    return Math.round((t - dayDate(0)) / 86400000);
  }

  function fmt(d){ return d.getDate() + "." + (d.getMonth()+1) + "."; }

  /* ---------- state helpers ---------- */

  function key(i,h){ return i + ":" + h; }
  function isDone(i,h){ return state.done[key(i,h)] === true; }

  function countFor(h){
    var n = 0;
    for(var i=0;i<DAYS;i++){ if(isDone(i,h)) n++; }
    return n;
  }

  function isFullDay(i){
    return HABITS.every(function(h){ return isDone(i,h.id); });
  }

  function streak(){
    var end = Math.min(todayIndex(), DAYS-1);
    if(end < 0) return 0;
    if(!isFullDay(end)) end--;
    var n = 0;
    while(end >= 0 && isFullDay(end)){ n++; end--; }
    return n;
  }

  function toggle(i,h){
    var k = key(i,h);
    if(state.done[k]) delete state.done[k];
    else state.done[k] = true;
    queueSave();
    render();
  }

  function scoreOf(i){
    var v = state.scores[i];
    return (typeof v === "number" && v >= 1 && v <= 10) ? Math.round(v) : 0;
  }

  function setScore(i, v){
    if(scoreOf(i) === v) delete state.scores[i];
    else state.scores[i] = v;
    queueSave();
    render();
  }

  function scoredDays(){
    var out = [];
    for(var i=0;i<DAYS;i++){
      var v = scoreOf(i);
      if(v) out.push(v);
    }
    return out;
  }

  function average(){
    var s = scoredDays();
    if(!s.length) return null;
    var sum = s.reduce(function(a,b){ return a + b; }, 0);
    return sum / s.length;
  }

  /* ---------- build ---------- */

  var built = false;

  function buildMeters(){
    var wrap = document.getElementById("meters");
    wrap.innerHTML = "";
    HABITS.forEach(function(h){
      var row = document.createElement("div");
      row.className = "meter";
      row.style.setProperty("--c", h.c);
      var segs = "";
      for(var i=0;i<DAYS;i++){ segs += '<div class="seg" data-h="'+h.id+'" data-i="'+i+'"></div>'; }
      row.innerHTML =
        '<div class="meter-name">'+h.name+'</div>' +
        '<div class="bar">'+segs+'</div>' +
        '<div class="meter-count" data-count="'+h.id+'">0/21</div>';
      wrap.appendChild(row);
    });
  }

  function buildWeeks(){
    var wrap = document.getElementById("weeks");
    wrap.innerHTML = "";

    var head = HABITS.map(function(h){
      return '<div class="head-cell" style="--c:'+h.c+'">'+h.tag+'</div>';
    }).join("");

    for(var w=0; w<3; w++){
      var week = document.createElement("section");
      week.className = "week";

      var rows = "";
      for(var d=0; d<7; d++){
        var i = w*7 + d;
        var cells = HABITS.map(function(h){
          return '<button class="cell" type="button" data-i="'+i+'" data-h="'+h.id+'" aria-pressed="false" ' +
                 'aria-label="Dagur '+(i+1)+' – '+h.name+'" ' +
                 'style="--c:'+h.c+';--t:'+h.t+';--e:'+h.e+'">'+CHECK+'</button>';
        }).join("");
        var scale = "";
        for(var v=1; v<=10; v++){
          scale += '<button class="sc" type="button" data-i="'+i+'" data-v="'+v+'" ' +
                   'aria-pressed="false" aria-label="Dagur '+(i+1)+' – einkunn '+v+' af 10">'+v+'</button>';
        }

        rows +=
          '<div class="day" data-day="'+i+'">' +
            '<div class="day-id">' +
              '<span class="day-num">'+(i+1)+'</span>' +
              '<span class="day-meta"></span>' +
            '</div>' +
            '<div class="cells">'+cells+'</div>' +
            '<div class="scale" role="group" aria-label="Hvernig var dagur '+(i+1)+'?">'+scale+'</div>' +
          '</div>';
      }

      week.innerHTML =
        '<div class="week-top">' +
          '<span class="week-label">Vika '+(w+1)+'</span>' +
          '<span class="week-range"></span>' +
        '</div>' +
        '<div class="head"><span></span><div class="head-cells">'+head+'</div></div>' +
        '<div class="days">'+rows+'</div>';

      wrap.appendChild(week);
    }

    wrap.addEventListener("click", function(ev){
      var cell = ev.target.closest(".cell");
      if(cell){ toggle(+cell.dataset.i, cell.dataset.h); return; }
      var sc = ev.target.closest(".sc");
      if(sc){ setScore(+sc.dataset.i, +sc.dataset.v); }
    });
  }

  function buildSpark(){
    var spark = document.getElementById("spark");
    spark.innerHTML = "";
    for(var i=0;i<DAYS;i++){
      var bar = document.createElement("div");
      bar.className = "spark-bar";
      bar.dataset.i = i;
      spark.appendChild(bar);
    }
  }

  /* ---------- render ---------- */

  function render(){
    if(!built){ buildMeters(); buildWeeks(); buildSpark(); built = true; }

    document.getElementById("start").value = state.start;

    var ti = todayIndex();

    document.querySelectorAll(".day").forEach(function(row){
      var i = +row.dataset.day;
      row.classList.toggle("today", i === ti);
      row.classList.toggle("future", i > ti);
      var meta = row.querySelector(".day-meta");
      if(i === ti){
        meta.innerHTML = '<span class="today-chip">í dag</span>';
      }else{
        var date = dayDate(i);
        meta.textContent = WD[date.getDay()] + " " + fmt(date);
      }
    });

    document.querySelectorAll(".week").forEach(function(week, w){
      week.querySelector(".week-range").textContent = fmt(dayDate(w*7)) + "–" + fmt(dayDate(w*7+6));
    });

    document.querySelectorAll(".cell").forEach(function(btn){
      btn.setAttribute("aria-pressed", isDone(+btn.dataset.i, btn.dataset.h) ? "true" : "false");
    });

    document.querySelectorAll(".sc").forEach(function(btn){
      var v = +btn.dataset.v;
      var s = scoreOf(+btn.dataset.i);
      btn.classList.toggle("filled", s > 0 && v <= s);
      btn.classList.toggle("peak", s === v);
      btn.setAttribute("aria-pressed", s === v ? "true" : "false");
    });

    document.querySelectorAll(".spark-bar").forEach(function(bar){
      var s = scoreOf(+bar.dataset.i);
      bar.classList.toggle("on", s > 0);
      bar.style.height = s ? (s * 10) + "%" : "";
    });

    var avg = average();
    var scored = scoredDays().length;
    document.getElementById("avg").textContent = avg === null ? "—" : avg.toFixed(1).replace(".", ",");
    document.getElementById("score-note").textContent =
      scored === 1 ? "1 dagur skráður" : scored + " dagar skráðir";

    var total = 0;
    HABITS.forEach(function(h){
      var n = countFor(h.id);
      total += n;
      document.querySelector('[data-count="'+h.id+'"]').textContent = n + "/21";
    });
    document.querySelectorAll(".seg").forEach(function(seg){
      seg.classList.toggle("on", isDone(+seg.dataset.i, seg.dataset.h));
    });

    document.getElementById("total").innerHTML = total + '<span>/63</span>';
    document.getElementById("streak").textContent = streak();
  }

  /* ---------- controls ---------- */

  document.getElementById("start").addEventListener("change", function(ev){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(ev.target.value)) return;
    state.start = ev.target.value;
    queueSave();
    render();
  });

  document.getElementById("reset").addEventListener("click", function(){
    if(!window.confirm("Núllstilla alla 21 dagana — merkingar og einkunnir? Þetta er ekki hægt að taka til baka.")) return;
    state.done = {};
    state.scores = {};
    queueSave();
    render();
  });

  loadLocal();
  render();
  connect();
})();
</script>
</body>
</html>
